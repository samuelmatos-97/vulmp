services:
  backend:
    # Build the image containing FastAPI and Alembic.
    build:
      context: .
      dockerfile: app/backend/Dockerfile

    image: vulmp-backend:0.1
    container_name: vulmp-backend

    # Inject the database configuration into the container.
    env_file:
      - .env

    # Expose the backend on localhost:8000
    ports:
      - "8000:8000"

    # Start the backend only after PostgreSQL becomes healthy.
    depends_on:
      # PostgreSQL must be ready before the backend starts.
      postgres:
        condition: service_healthy

      # All database migrations must finish successfully first.
      migrate:
        condition: service_completed_successfully

    healthcheck:
      # The backend is healthy only when the readiness endpoint succeeds.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    # Use the same image and dependencies as the backend.
    build:
      context: .
      dockerfile: app/backend/Dockerfile

    image: vulmp-backend:0.1
    container_name: vulmp-migrate

    env_file:
      - .env

    # Apply every pending migration and then exit.
    command:
      [
        "python",
        "-m",
        "alembic",
        "-c",
        "alembic.ini",
        "upgrade",
        "head",
      ]

    depends_on:
      postgres:
        condition: service_healthy

    # This is a one-time job and should not restart automatically.
    restart: "no"

  postgres:
    image: postgres:16
    container_name: vulmp-postgres

    # Configure PostgreSQL using the local environment variables.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Expose PostgreSQL to the host for local administration.
    ports:
      - "${POSTGRES_PORT}:5432"

    # Preserve database data outside the container lifecycle.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Check whether PostgreSQL is accepting connections.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Named volume containing the persistent PostgreSQL data.
  postgres_data:
